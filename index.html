<style>
:root{--g:#0e8579;--g2:#16a394;--gd:#0a4f48;--sage:#b4e3d8;--sagel:#def5ef;--ivory:#f6fdfb;--paper:#e6f6f2;--gold:#c1925f;--goldl:#ecd2b4;--blush:#d3eee7;--ink:#233b37;--mut:#5f7d77;--serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Lato',system-ui,-apple-system,'Segoe UI',sans-serif;--script:'Great Vibes','Snell Roundhand','Apple Chancery',cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--sans);font-size:14px;line-height:1.75;color:var(--ink);background:var(--gd);overflow-x:hidden}
body.lock{overflow:hidden}
img{display:block;max-width:100%}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.bgfx{position:fixed;inset:0;background:#0a4f48 center/cover no-repeat;filter:blur(18px) brightness(.55);transform:scale(1.1);z-index:-1}
.app{position:relative;max-width:480px;margin:0 auto;background:var(--ivory);min-height:100vh;box-shadow:0 0 80px rgba(0,0,0,.45);overflow:hidden}
.side{display:none}
@media(min-width:1100px){
 .side{display:flex;position:fixed;top:0;bottom:0;left:0;width:calc(50% - 240px);flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px}
 .side .e{letter-spacing:.4em;font-size:11px;text-transform:uppercase;color:var(--goldl)}
 .side .n{font-family:var(--script);font-size:84px;line-height:1.1;margin:10px 0}
 .side .d{font-family:var(--serif);font-size:24px;letter-spacing:.08em}
 .side .t{margin-top:22px;font-size:11px;letter-spacing:.25em;color:rgba(255,255,255,.65);text-transform:uppercase}
}

/* ---------- cover ---------- */
.cover{position:fixed;z-index:60;top:0;bottom:0;left:max(0px,calc(50% - 240px));width:min(100%,480px);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 28px calc(24px + env(safe-area-inset-bottom));background:var(--paper) center/cover no-repeat;transition:transform 1.15s cubic-bezier(.75,0,.2,1),opacity .4s 1s;overflow:hidden}
.cover::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(246,253,251,.4),rgba(246,253,251,.08) 42%,rgba(6,52,47,.38))}
.cover::after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,255,255,.7);border-radius:2px;pointer-events:none}
.cover>*{position:relative}
.cover.out{transform:translateY(-101%);opacity:0;pointer-events:none}
.cover .spr{position:absolute!important}
.cover .e{font-size:10.5px;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
/* kotak kaca transparan di sampul */
.cvbox{position:relative;z-index:1;width:100%;max-width:340px;padding:30px 22px 26px;background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 18px 50px rgba(6,52,47,.24)}
.cover .cvbox .e{color:var(--g);font-weight:700}
.cover .cvbox .tg{color:var(--gd)}
.cover .cvbox .kp,.cover .cvbox .mf{color:var(--gd)}
.cover .spr.cf{width:150px;opacity:1}
.cover .spr.tl{top:14px;left:14px}.cover .spr.tr{top:14px;right:14px}.cover .spr.bl{bottom:14px;left:14px}.cover .spr.br{bottom:14px;right:14px}
.cover .nm{font-family:var(--script);font-size:56px;line-height:1.05;color:var(--g);margin:2px 0}
.cover .tg{font-family:var(--serif);font-size:15px;letter-spacing:.3em;color:var(--gold);margin-bottom:14px}
.cover .kp{font-size:10.5px;letter-spacing:.12em;color:var(--mut)}
.cover .gs{font-family:var(--serif);font-size:23px;font-weight:600;margin:3px 0;padding:5px 22px;border-top:1px solid var(--goldl);border-bottom:1px solid var(--goldl);max-width:100%;overflow-wrap:anywhere;color:var(--g)}
.cover .mf{font-size:9.5px;color:var(--mut);margin-bottom:14px}
.btn{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:999px;padding:13px 26px;font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;transition:.25s;background:var(--gold);color:#fff;box-shadow:0 8px 22px rgba(193,146,95,.35)}
.btn:active{transform:scale(.96)}
.btn.o{background:transparent;color:var(--g);border:1px solid var(--g);box-shadow:none}
.btn.l{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.7);box-shadow:none}
.btn.s{padding:10px 18px;font-size:10px}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- umum ---------- */
.sec{position:relative;padding:76px 26px;text-align:center;overflow:hidden}
.sec>*{position:relative;z-index:1}
.eyebrow{font-size:10px;letter-spacing:.4em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.sec h2{font-family:var(--script);font-weight:400;font-size:46px;line-height:1.1;color:var(--g)}
.sub{font-family:var(--serif);font-size:17px;color:var(--mut);margin:8px auto 34px;max-width:340px;font-style:italic}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:14px auto 22px}
.orn i{display:block;height:1px;width:54px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}
.orn svg{width:16px;height:16px;fill:var(--gold)}
.spr{position:absolute!important;z-index:0!important;width:120px;opacity:.9;pointer-events:none}
svg.spr{padding:0;margin:0;max-width:none;height:auto}
.ev .eyebrow{color:#a8754a;font-weight:500}
.spr.tl{top:0;left:0}.spr.tr{top:0;right:0;transform:scaleX(-1)}
.spr.bl{bottom:0;left:0;transform:scaleY(-1)}.spr.br{bottom:0;right:0;transform:scale(-1,-1)}
.paper{background:var(--paper)}
.green{background:linear-gradient(180deg,var(--g) 0%,var(--gd) 100%);color:#fff}
.green h2,.green .sub{color:#fff}.green .sub{opacity:.75}
.green .eyebrow{color:var(--goldl)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}

/* ---------- hero ---------- */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;text-align:center;padding:60px 26px 110px;background:#0a5c54 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(6,52,47,.55),rgba(6,52,47,.35) 45%,rgba(6,52,47,.85))}
.hero .e{font-size:11px;letter-spacing:.45em;text-transform:uppercase;color:var(--goldl)}
.hero .nm{font-family:var(--script);font-size:72px;line-height:1.05;margin:12px 0 8px;text-shadow:0 3px 20px rgba(0,0,0,.4)}
.hero .tg{font-family:var(--serif);font-size:23px;letter-spacing:.16em;margin-bottom:30px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:340px}
.cd div{background:rgba(255,255,255,.12);border:1px solid rgba(229,211,173,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:14px;padding:12px 0 9px}
.cd b{display:block;font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1}
.cd span{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--goldl)}
.cdn{font-family:var(--serif);font-size:20px;font-style:italic}
.scroll{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);width:22px;height:36px;border:1.5px solid rgba(255,255,255,.7);border-radius:12px;z-index:1}
.scroll::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:sc 1.8s infinite}
@keyframes sc{0%{opacity:1;transform:translateY(0)}80%,100%{opacity:0;transform:translateY(14px)}}

/* ---------- ayat ---------- */
.ar{font-family:'Noto Naskh Arabic','Traditional Arabic',serif;font-size:25px;line-height:2.1;color:var(--g);direction:rtl;margin:6px 0 16px}
.qt{font-family:var(--serif);font-size:18px;font-style:italic;line-height:1.7;color:var(--ink)}
.qs{margin-top:12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.sal{font-family:var(--serif);font-size:19px;line-height:1.75;margin-bottom:6px}
.sal b{display:block;font-family:var(--script);font-weight:400;font-size:34px;color:var(--g);margin-bottom:6px}

/* ---------- mempelai ---------- */
.arch{position:relative;width:236px;height:316px;margin:0 auto 22px;border-radius:118px 118px 8px 8px;padding:7px;background:linear-gradient(160deg,var(--goldl),var(--gold) 55%,var(--goldl))}
.arch div{width:100%;height:100%;border-radius:112px 112px 4px 4px;overflow:hidden;background:var(--blush)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 25%}
.paper#mempelai .arch{border-radius:50%;padding:6px}.paper#mempelai .arch div{border-radius:50%}
.hero::before{background:linear-gradient(180deg,rgba(6,52,47,.5),rgba(6,52,47,.3) 45%,rgba(6,52,47,.85))}
.pn{font-family:var(--script);font-size:46px;line-height:1.15;color:var(--g)}
.pf{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:2px}
.po{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.7}
.po b{font-weight:500;color:var(--ink)}
.ig{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:11px;letter-spacing:.08em;text-decoration:none;color:var(--gold)}
.amp{font-family:var(--script);font-size:64px;color:var(--gold);line-height:1;margin:34px 0}

/* ---------- cerita ---------- */
.tl{position:relative;text-align:left;max-width:340px;margin:0 auto;padding-left:34px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:1px;background:linear-gradient(var(--gold),rgba(193,146,95,.15))}
.tli{position:relative;margin-bottom:30px;background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 10px 30px rgba(14,133,121,.08)}
.tli::before{content:"";position:absolute;left:-31px;top:22px;width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(193,146,95,.2)}
.tli small{font-size:10px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.tli h3{font-family:var(--serif);font-size:23px;color:var(--g);line-height:1.2;margin:3px 0 6px}
.tli p{font-size:13px;color:#59625b}

/* ---------- acara ---------- */
.ev{background:var(--ivory);color:var(--ink);border-radius:22px;padding:34px 24px 28px;margin:0 auto 22px;max-width:380px;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.28)}
.ev::before{content:"";position:absolute;inset:7px;border:1px solid var(--goldl);border-radius:16px;pointer-events:none}
.ev h3{font-family:var(--script);font-weight:400;font-size:42px;color:var(--g);line-height:1.1}
.evd{display:flex;align-items:stretch;justify-content:center;gap:14px;margin:14px 0 10px}
.evd .h{font-family:var(--serif);font-size:20px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;border-right:1px solid var(--goldl);border-left:1px solid var(--goldl);padding:6px 14px;display:flex;align-items:center}
.evd .t1,.evd .t2{display:flex;flex-direction:column;justify-content:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.evd .b{font-family:var(--serif);font-size:56px;line-height:.95;font-weight:600;color:var(--gold)}
.ev .jm{font-size:13px;letter-spacing:.1em;font-weight:500}
.ev .tp{font-family:var(--serif);font-size:22px;font-weight:600;margin-top:14px;line-height:1.25;color:var(--g)}
.ev .al{font-size:12.5px;color:var(--mut);margin:4px 0 18px}
.ev .bt{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.live{max-width:380px;margin:0 auto}

/* ---------- galeri ---------- */
.gal{columns:2;column-gap:10px}
.gal img{width:100%;margin-bottom:10px;border-radius:12px;cursor:zoom-in;transition:transform .3s;background:var(--blush);break-inside:avoid}
.gal img:active{transform:scale(.98)}
.lb{position:fixed;inset:0;z-index:120;background:rgba(10,18,14,.94);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:84vh;border-radius:8px;object-fit:contain}
.lb button{position:absolute;background:rgba(255,255,255,.14);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:22px}
.lb .x{top:18px;right:18px}.lb .p{left:12px;top:50%}.lb .n{right:12px;top:50%}
.lb .c{position:absolute;bottom:22px;color:#fff;font-size:12px;letter-spacing:.2em}

/* ---------- hadiah ---------- */
.bank{background:#fff;border-radius:18px;padding:24px 20px;margin:0 auto 14px;max-width:360px;box-shadow:0 10px 30px rgba(14,133,121,.1);border-top:3px solid var(--gold)}
.bank .bn{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);font-weight:600}
.bank .no{font-family:var(--sans);font-size:30px;font-weight:600;letter-spacing:.06em;color:var(--g);margin:6px 0 0;word-break:break-all}
.bank .an{font-size:12.5px;color:var(--mut);margin-bottom:14px}
.bank .ad{font-size:13px;color:var(--ink);margin:6px 0 14px;line-height:1.6}

/* ---------- ucapan ---------- */
.fm{max-width:370px;margin:0 auto;text-align:left;background:#fff;border-radius:20px;padding:24px 20px;box-shadow:0 14px 36px rgba(14,133,121,.1)}
.fm label.l{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:0 0 5px}
.fm input[type=text],.fm textarea{width:100%;border:1px solid #cde8e1;border-radius:12px;padding:12px 14px;font:inherit;font-size:14px;background:var(--ivory);color:var(--ink);outline:0;margin-bottom:14px;transition:.2s}
.fm textarea{min-height:104px;resize:vertical}
.fm input:focus,.fm textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(193,146,95,.18)}
.rd{display:grid;gap:8px;margin-bottom:14px}
.rd label{display:flex;align-items:center;gap:10px;border:1px solid #cde8e1;border-radius:12px;padding:10px 14px;font-size:13px;cursor:pointer;background:var(--ivory)}
.rd input{accent-color:var(--g);width:16px;height:16px}
.rd label:has(input:checked){border-color:var(--g);background:var(--sagel)}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--mut);margin-bottom:16px}
.ck input{accent-color:var(--g);margin-top:4px}
.fm .btn{width:100%;justify-content:center}
.cnt{float:right;font-size:10px;color:var(--mut);letter-spacing:0}
.wl{max-width:370px;margin:26px auto 0;max-height:430px;overflow:auto;text-align:left;display:grid;gap:12px;padding:2px;scrollbar-width:thin}
.wi{display:flex;gap:12px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 6px 18px rgba(14,133,121,.07)}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:20px;font-weight:600}
.wi b{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.wi p{font-size:13px;color:#4c554f;margin-top:3px;overflow-wrap:anywhere;white-space:pre-line}
.bd{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:99px;margin-left:6px;vertical-align:middle;background:var(--sagel);color:var(--g)}
.bd.t{background:#fdebdc;color:#a14d17}.bd.r{background:#f6ead3;color:#8a6d22}
.wt{display:block;font-size:10.5px;color:var(--mut);margin-top:5px}
.emp{font-size:13px;color:var(--mut);font-style:italic}

/* ---------- penutup ---------- */
.end{min-height:92vh;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;background:#0a5c54 center/cover no-repeat;padding:80px 28px 150px}
.end::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(6,52,47,.8),rgba(6,52,47,.5) 50%,rgba(6,52,47,.92))}
.end p.t{font-family:var(--serif);font-size:19px;line-height:1.8;max-width:340px;opacity:.95}
.end .nm{font-family:var(--script);font-size:62px;line-height:1.1;margin:18px 0 6px}
.end .w{font-family:var(--serif);font-style:italic;font-size:19px;margin-top:10px;color:var(--goldl)}
.end .ct{margin-top:22px;font-size:11px;color:rgba(255,255,255,.7);max-width:300px;line-height:1.7}
.cr{position:absolute;bottom:96px;left:0;right:0;z-index:1;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.5)}

/* ---------- navigasi & musik ---------- */
.nav{position:fixed;z-index:50;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;width:min(92vw,400px);transform:translate(-50%,140%);display:flex;justify-content:space-around;background:rgba(246,253,251,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--goldl);border-radius:999px;padding:7px 8px;box-shadow:0 12px 36px rgba(0,0,0,.28);transition:transform .8s cubic-bezier(.2,.8,.2,1) .3s}
.nav.on{transform:translate(-50%,0)}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:999px;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--mut);transition:.25s}
.nav a svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:#fff;background:var(--g)}
.mu{position:fixed;z-index:55;right:max(14px,calc(50% - 226px));bottom:calc(86px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:1px solid var(--goldl);background:rgba(14,133,121,.92);color:#fff;display:none;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.mu.on{display:grid}
.mu svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mu.play svg{animation:spin 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;z-index:200;left:50%;bottom:110px;transform:translate(-50%,20px);background:var(--gd);color:#fff;padding:11px 20px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.35s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.err{padding:60px 24px;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.ev{border-radius:150px 150px 22px 22px;padding-top:50px}.ev::before{border-radius:144px 144px 16px 16px}
</style>
</head>

<script>
(function(){
'use strict';
var D=window.DATA;
if(!D){document.getElementById('app').innerHTML='<div class="err">Data undangan tidak ditemukan. Periksa file data/data-undangan.js</div>';document.body.classList.remove('lock');return;}
var FB=window.FB||{aktif:false};
var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
var BLN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var OFS={WIB:'+07:00',WITA:'+08:00',WIT:'+09:00'};
var ZONA=OFS[D.zona]?D.zona:'WIB';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function tgl(s){var p=String(s||'').split('-');if(p.length<3)return '';var d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+', '+(+p[2])+' '+BLN[+p[1]-1]+' '+p[0]}
function jam(s){return String(s||'').replace(':','.')}
function rentang(e){return jam(e.jamMulai)+(e.jamSelesai?' - '+jam(e.jamSelesai):' - selesai')+' '+ZONA}
function wkt(tg,jm){return new Date(tg+'T'+(jm||'00:00')+':00'+OFS[ZONA])}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2800)}
function salin(txt,pesan){
  function ok(){toast(pesan||'Tersalin')}
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(txt).then(ok,fb)}else fb();
  function fb(){var a=document.createElement('textarea');a.value=txt;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Gagal menyalin')}a.remove()}
}
function ago(d){var s=(Date.now()-d.getTime())/1000;if(s<60)return 'baru saja';if(s<3600)return Math.floor(s/60)+' menit lalu';if(s<86400)return Math.floor(s/3600)+' jam lalu';if(s<2592000)return Math.floor(s/86400)+' hari lalu';return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear()}

/* ---------- hiasan ranting ---------- */
function sprig(){
  /* ornamen sudut minimalis: busur garis emas + belah ketupat kecil */
  return '<svg class="spr" viewBox="0 0 200 200" aria-hidden="true"><g fill="none" stroke="#c1925f" stroke-linecap="round">'+
    '<path d="M0 70A70 70 0 0 0 70 0" stroke-width="1.4"/>'+
    '<path d="M0 94A94 94 0 0 0 94 0" stroke-width="1" stroke-opacity=".65"/>'+
    '<path d="M0 118A118 118 0 0 0 118 0" stroke-width=".8" stroke-opacity=".35"/>'+
    '</g><g fill="#c1925f"><rect x="46.5" y="46.5" width="6" height="6" transform="rotate(45 49.5 49.5)"/>'+
    '<circle cx="66.5" cy="66.5" r="1.8" fill-opacity=".8"/><circle cx="0" cy="70" r="2.2"/><circle cx="70" cy="0" r="2.2"/></g></svg>';
}
var ORN='<div class="orn"><i></i><svg viewBox="0 0 24 24"><path d="M12 2l2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6z"/></svg><i></i></div>';
var IC={
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>',
  cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  img:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>',
  msg:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 1 1 21 11.5z"/>',
  pin:'<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
  copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  play:'<rect x="2" y="5" width="20" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  ig:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>'
};
function svg(n){return '<svg viewBox="0 0 24 24">'+IC[n]+'</svg>'}

/* ---------- data turunan ---------- */
var pr=D.pria||{},wn=D.wanita||{},F=D.foto||{},ak=D.akad||null,rs=D.resepsi||null;
var PANG=(pr.panggilan||'Mempelai Pria'),WANG=(wn.panggilan||'Mempelai Wanita');
var NAMA=PANG+' & '+WANG;
var tamu=(function(){var v=(new URLSearchParams(location.search).get('to')||'').trim().slice(0,40);return v.toLowerCase()==='tamu undangan'?'':v})();
var S={ucapanPublik:D.ucapanPublik!==false,turut:!!D.turutMengundangTampil,rek:[true,true]};
var utama=ak||rs;

function eventCard(judul,e,idx,ic){
  if(!e)return '';
  var p=String(e.tanggal).split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
  var gcal='';
  try{var st=wkt(e.tanggal,e.jamMulai),en=e.jamSelesai?wkt(e.tanggal,e.jamSelesai):new Date(st.getTime()+2*3600*1000);
    var f=function(d){return d.toISOString().replace(/[-:]|\.\d{3}/g,'')};
    gcal='https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(judul+' '+NAMA)+'&dates='+f(st)+'/'+f(en)+'&details='+encodeURIComponent('Pernikahan '+(pr.nama||PANG)+' & '+(wn.nama||WANG))+'&location='+encodeURIComponent(e.tempat+', '+e.alamat);}catch(x){}
  return '<div class="ev rv d'+idx+'"><div class="eyebrow">'+esc(ic)+'</div><h3>'+esc(judul)+'</h3>'+
   '<div class="evd"><div class="t1"><span>'+esc(BLN[dt.getMonth()].slice(0,3))+'</span></div><div class="h">'+esc(HARI[dt.getDay()])+'</div><div class="t2"><span>'+dt.getFullYear()+'</span></div></div>'+
   '<div class="evd" style="margin:0 0 8px"><div class="b">'+(+p[2])+'</div></div>'+
   '<div class="jm">'+esc(rentang(e))+'</div>'+
   '<div class="tp">'+esc(e.tempat)+'</div><div class="al">'+esc(e.alamat)+'</div>'+
   '<div class="bt">'+(e.maps?'<a class="btn s" target="_blank" rel="noopener" href="'+esc(e.maps)+'">'+svg('pin')+'Buka Google Maps</a>':'')+
   (gcal?'<a class="btn s o" target="_blank" rel="noopener" href="'+esc(gcal)+'">'+svg('cal')+'Simpan ke Kalender</a>':'')+'</div></div>';
}
function mempelai(o,foto,gender){
  var anak=gender==='p'?(o.putraKe?'Putra ke-'+esc(o.putraKe):'Putra'):(o.putriKe?'Putri ke-'+esc(o.putriKe):'Putri');
  var ig=o.instagram?'<a class="ig" target="_blank" rel="noopener" href="https://instagram.com/'+esc(String(o.instagram).replace(/^@/,''))+'">'+svg('ig')+'@'+esc(String(o.instagram).replace(/^@/,''))+'</a>':'';
  return '<div class="rv"><div class="arch"><div><img src="'+esc(foto)+'" alt="'+esc(o.nama)+'" loading="lazy"></div></div>'+
   '<div class="pn">'+esc(o.panggilan)+'</div><div class="pf">'+esc(o.nama)+'</div>'+
   '<div class="po">'+anak+' dari<br><b>Bapak '+esc(o.ayah)+'</b> &amp; <b>Ibu '+esc(o.ibu)+'</b></div>'+ig+'</div>';
}

function build(){
  var h='';
  /* cover dibuat terpisah di bawah */
  h+='<section class="sec hero" id="beranda" style="'+(F.latarUtama?'background-image:url('+esc(F.latarUtama)+')':'')+'">'+
    '<div class="eyebrow" style="color:var(--goldl)">Kami Menikah</div>'+
    '<div class="nm rv">'+esc(NAMA.replace(' & ',' & '))+'</div>'+
    (utama?'<div class="tg rv d1">'+esc(tgl(utama.tanggal))+'</div>':'')+
    '<div class="cd rv d2" id="cd"></div><div class="scroll"></div></section>';

  h+='<section class="sec" id="salam">'+sprig().replace('class="spr"','class="spr tl"')+sprig().replace('class="spr"','class="spr br"')+
    '<div class="sal rv"><b>Assalamu\'alaikum Wr. Wb.</b>Dengan memohon rahmat Allah SWT, kami mengundang Anda untuk hadir dan mendoakan pernikahan kami.</div></section>';

  h+='<section class="sec paper" id="mempelai">'+sprig().replace('class="spr"','class="spr tr"')+sprig().replace('class="spr"','class="spr bl"')+
    '<div class="eyebrow rv">Bismillahirrahmanirrahim</div><h2 class="rv">Mempelai</h2>'+ORN+
    '<p class="sub rv">Maha Suci Allah yang telah menciptakan makhluk-Nya berpasang-pasangan.</p>'+
    mempelai(pr,F.pria,'p')+'<div class="amp rv">&amp;</div>'+mempelai(wn,F.wanita,'w')+'</section>';

  if(D.cerita&&D.cerita.length){
    h+='<section class="sec" id="cerita"><div class="eyebrow rv">Perjalanan Kami</div><h2 class="rv">Kisah Cinta</h2>'+ORN+'<div class="tl">'+
      D.cerita.map(function(c,i){return '<div class="tli rv d'+(i%3)+'"><small>'+esc(c.waktu)+'</small><h3>'+esc(c.judul)+'</h3><p>'+esc(c.isi)+'</p></div>'}).join('')+'</div></section>';
  }

  h+='<section class="sec green" id="acara"><div class="eyebrow rv">Save The Date</div><h2 class="rv">Rangkaian Acara</h2>'+ORN+
    '<p class="sub rv">Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir.</p>'+
    eventCard('Akad Nikah',ak,0,'Ijab Qabul')+eventCard('Resepsi',rs,1,'Walimatul Ursy')+
    (D.siaranLangsung?'<div class="live rv"><p class="sub" style="margin-bottom:14px">Tidak bisa hadir? Saksikan secara daring:</p><a class="btn l" target="_blank" rel="noopener" href="'+esc(D.siaranLangsung)+'">'+svg('play')+'Siaran Langsung</a></div>':'')+'</section>';

  if(D.galeri&&D.galeri.length){
    h+='<section class="sec" id="galeri"><div class="eyebrow rv">Momen Bahagia</div><h2 class="rv">Galeri</h2>'+ORN+'<div class="gal rv" id="gal">'+
      D.galeri.map(function(g,i){return '<img src="'+esc(g)+'" alt="Foto galeri '+(i+1)+'" loading="lazy" data-i="'+i+'">'}).join('')+'</div></section>';
  }

  var hd=(D.hadiah||[]).slice(0,2);
  if(hd.length||D.alamatKado){
    h+='<section class="sec paper" id="hadiah">'+sprig().replace('class="spr"','class="spr tl"')+'<div class="eyebrow rv">Tanda Kasih</div><h2 class="rv">Hadiah Pernikahan</h2>'+ORN+
      '<p class="sub rv">Doa restu Anda adalah hadiah terindah. Namun bila ingin memberi tanda kasih, dapat melalui:</p><div id="bank">'+
      hd.map(function(b,i){return '<div class="bank rv" data-r="'+i+'"><div class="bn">'+esc(b.bank)+'</div><div class="no">'+esc(b.nomor)+'</div><div class="an">a.n. '+esc(b.atasNama)+'</div><button class="btn s o" data-cp="'+esc(b.nomor)+'">'+svg('copy')+'Salin nomor</button></div>'}).join('')+'</div>'+
      (D.alamatKado?'<div class="bank rv"><div class="bn">Kirim Kado</div><div class="ad">'+esc(D.alamatKado)+'</div><button class="btn s o" data-cp="'+esc(D.alamatKado)+'">'+svg('copy')+'Salin alamat</button></div>':'')+'</section>';
  }

  h+='<section class="sec" id="ucapan">'+sprig().replace('class="spr"','class="spr tr"')+'<div class="eyebrow rv">RSVP</div><h2 class="rv">Ucapan &amp; Doa</h2>'+ORN+
    '<p class="sub rv">Konfirmasi kehadiran dan kirimkan doa terbaik untuk kami.</p>'+
    '<form class="fm rv" id="fm" autocomplete="off"><label class="l" for="fn">Nama</label><input type="text" id="fn" maxlength="40" required placeholder="Nama Anda" value="'+esc(tamu)+'">'+
    '<label class="l" for="fi">Ucapan &amp; Doa <span class="cnt" id="cnt">0/300</span></label><textarea id="fi" maxlength="300" required placeholder="Tuliskan ucapan dan doa..."></textarea>'+
    '<label class="l">Konfirmasi Kehadiran</label><div class="rd"><label><input type="radio" name="hd" value="hadir" checked> Insya Allah, saya hadir</label><label><input type="radio" name="hd" value="tidak"> Mohon maaf, belum bisa hadir</label><label><input type="radio" name="hd" value="ragu"> Masih ragu</label></div>'+
    (D.pemesan&&D.pemesan.whatsapp?'<label class="ck"><input type="checkbox" id="fw"> Kirim juga ke WhatsApp tuan rumah</label>':'')+
    '<button class="btn" type="submit" id="fs">'+svg('send')+'Kirim Ucapan</button></form>'+
    '<div class="wl" id="wl"></div></section>';

  h+='<section class="sec paper" id="turut" style="display:none"><div class="eyebrow rv">Turut Mengundang</div><h2 class="rv">Turut Mengundang</h2>'+ORN+'<div id="tm" class="sal rv" style="font-size:18px"></div></section>';

  h+='<section class="sec end" id="penutup" style="'+(F.penutup?'background-image:url('+esc(F.penutup)+')':'')+'">'+
    '<p class="t rv">Terima kasih atas kehadiran, doa, dan restu Bapak/Ibu/Saudara/i sekalian. Semoga Allah SWT membalas kebaikan Anda dan menjadikan kami keluarga yang sakinah, mawaddah, warahmah.</p>'+
    '<div class="nm rv d1">'+esc(NAMA)+'</div><div class="w rv d2">Wassalamu\'alaikum Wr. Wb.</div>'+
    (D.catatan?'<div class="ct rv">'+esc(D.catatan)+'</div>':'')+'<div class="cr">Undangan Digital</div></section>';
  $('#app').innerHTML=cover()+h;
}

function cover(){
  return '<section class="cover" id="cover"'+(F.sampul?' style="background-image:url('+esc(F.sampul)+')"':'')+'>'+
   sprig().replace('class="spr"','class="spr cf tl"')+sprig().replace('class="spr"','class="spr cf tr"')+
   sprig().replace('class="spr"','class="spr cf bl"')+sprig().replace('class="spr"','class="spr cf br"')+
   '<div class="cvbox"><div class="e">The Wedding Of</div><div class="nm">'+esc(NAMA)+'</div>'+(utama?'<div class="tg">'+esc(String(utama.tanggal).split('-').reverse().join(' . '))+'</div>':'')+
   '<div class="kp">Kepada Yth. Bapak/Ibu/Saudara/i</div><div class="gs">'+esc(tamu||'Tamu Undangan')+'</div><div class="mf">Mohon maaf apabila terdapat kesalahan penulisan nama dan gelar.</div>'+
   '<button class="btn" id="buka">'+svg('heart')+'Buka Undangan</button></div></section>';
}

/* ---------- perilaku ---------- */
function countdown(){
  var el=$('#cd');if(!el||!ak&&!rs)return;
  var tgt=wkt(utama.tanggal,utama.jamMulai).getTime();
  function t(){
    var d=tgt-Date.now();
    if(d<=0){el.style.display='block';el.className='cdn rv in';el.textContent='Alhamdulillah, acara telah berlangsung. Terima kasih atas doa Anda.';return}
    var s=Math.floor(d/1000),dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    el.innerHTML=[[dd,'Hari'],[hh,'Jam'],[mm,'Menit'],[ss,'Detik']].map(function(x){return '<div><b>'+String(x[0]).padStart(2,'0')+'</b><span>'+x[1]+'</span></div>'}).join('');
    setTimeout(t,1000);
  }
  t();
}
function reveal(){
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  $$('.rv').forEach(function(e){io.observe(e)});
}
function nav(){
  var items=[['beranda','home','Awal'],['mempelai','heart','Mempelai'],['acara','cal','Acara'],['galeri','img','Galeri'],['ucapan','msg','Ucapan']].filter(function(i){return $('#'+i[0])});
  $('#nav').innerHTML=items.map(function(i){return '<a href="#'+i[0]+'" data-s="'+i[0]+'"><svg viewBox="0 0 24 24">'+IC[i[1]]+'</svg>'+i[2]+'</a>'}).join('');
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('#nav a').forEach(function(a){a.classList.toggle('on',a.dataset.s===e.target.id)})}})},{rootMargin:'-45% 0px -50% 0px'});
  items.forEach(function(i){io.observe($('#'+i[0]))});
}
function galeri(){
  var g=$('#gal');if(!g)return;var lb=$('#lb'),im=$('img',lb),c=$('.c',lb),cur=0,L=D.galeri;
  function show(i){cur=(i+L.length)%L.length;im.src=L[cur];c.textContent=(cur+1)+' / '+L.length}
  g.addEventListener('click',function(e){var t=e.target.closest('img');if(!t)return;show(+t.dataset.i);lb.classList.add('on')});
  $('.x',lb).onclick=function(){lb.classList.remove('on')};
  $('.p',lb).onclick=function(){show(cur-1)};$('.n',lb).onclick=function(){show(cur+1)};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('on')});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
  var x0=null;lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0==null)return;var dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));x0=null});
}
function musik(){
  var a=$('#aud'),b=$('#mu');
  if(!D.musik){return {mulai:function(){}}}
  a.src=D.musik;var gagal=false;
  a.addEventListener('error',function(){if(!gagal){gagal=true;toast('Musik tidak dapat diputar. Periksa file musik.')}b.classList.remove('play')});
  a.addEventListener('play',function(){b.classList.add('play')});a.addEventListener('pause',function(){b.classList.remove('play')});
  b.onclick=function(){if(a.paused){a.play().catch(function(){toast('Musik tidak dapat diputar. Periksa file musik.')})}else a.pause()};
  return {mulai:function(){b.classList.add('on');a.play().catch(function(){})}};
}

/* ---------- ucapan ---------- */
var LKEY='ucapan_'+(D.kode||'x');
function lokal(){try{return JSON.parse(localStorage.getItem(LKEY)||'[]').map(function(u){u.waktu=new Date(u.waktu);return u})}catch(e){return []}}
function simpanLokal(u){try{var l=JSON.parse(localStorage.getItem(LKEY)||'[]');l.unshift(u);localStorage.setItem(LKEY,JSON.stringify(l.slice(0,50)))}catch(e){}}
var HD={hadir:['Hadir',''],tidak:['Berhalangan','t'],ragu:['Ragu','r']};
function daftar(){
  var el=$('#wl');if(!el)return;
  function tampil(arr,catatan){
    if(!arr.length){el.innerHTML='<div class="emp">'+esc(catatan||'Jadilah yang pertama mengirimkan ucapan.')+'</div>';return}
    el.innerHTML=arr.map(function(u){var b=HD[u.hadir]||HD.hadir;return '<div class="wi"><div class="av">'+esc((u.nama||'?').trim().charAt(0).toUpperCase())+'</div><div><b>'+esc(u.nama)+'</b><span class="bd '+b[1]+'">'+b[0]+'</span><p>'+esc(u.isi)+'</p><span class="wt">'+esc(ago(u.waktu))+'</span></div></div>'}).join('');
  }
  var seed=(D.ucapan||[]).map(function(u){return {nama:u.nama,isi:u.isi,hadir:u.hadir||'hadir',waktu:new Date(u.waktu||Date.now())}});
  if(!S.ucapanPublik){tampil([], 'Ucapan hanya dapat dibaca oleh mempelai. Terima kasih atas doa Anda.');return}
  if(FB.aktif){FB.daftarUcapan(false).then(function(a){tampil(a)}).catch(function(){tampil(lokal().concat(seed))})}
  else tampil(lokal().concat(seed));
}
function form(){
  var f=$('#fm');if(!f)return;
  $('#fi').addEventListener('input',function(){$('#cnt').textContent=this.value.length+'/300'});
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var nama=$('#fn').value.trim(),isi=$('#fi').value.trim(),hd=(f.querySelector('input[name=hd]:checked')||{}).value||'hadir';
    if(!nama||!isi){toast('Nama dan ucapan wajib diisi');return}
    var btn=$('#fs');btn.disabled=true;
    var u={nama:nama.slice(0,40),isi:isi.slice(0,300),hadir:hd};
    var wa=$('#fw')&&$('#fw').checked;
    function selesai(){
      toast('Ucapan terkirim. Terima kasih!');$('#fi').value='';$('#cnt').textContent='0/300';btn.disabled=false;daftar();
      if(wa){var st={hadir:'Insya Allah hadir',tidak:'Mohon maaf, belum bisa hadir',ragu:'Masih ragu'}[hd];
        window.open('https://wa.me/'+String(D.pemesan.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent('Assalamu\'alaikum, saya '+u.nama+'.\nKonfirmasi kehadiran: '+st+'.\n\nUcapan: '+u.isi),'_blank')}
    }
    if(FB.aktif){FB.kirimUcapan(u).then(selesai).catch(function(){btn.disabled=false;toast('Ucapan gagal terkirim. Coba lagi.')})}
    else{u.waktu=new Date();simpanLokal(u);selesai()}
  });
}

/* ---------- pengaturan dari admin ---------- */
function terapkan(){
  $$('#bank [data-r]').forEach(function(e){e.style.display=S.rek[+e.dataset.r]===false?'none':''});

function muatPengaturan(){
  if(!FB.aktif)return Promise.resolve();
  return FB.pengaturan().then(function(p){if(!p)return;
    if(typeof p.ucapanPublik==='boolean')S.ucapanPublik=p.ucapanPublik;
    if(typeof p.turutTampil==='boolean')S.turut=p.turutTampil;
    if(typeof p.rekening1==='boolean')S.rek[0]=p.rekening1;
    if(typeof p.rekening2==='boolean')S.rek[1]=p.rekening2;
  }).catch(function(){});
}
